<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Main menu branches to registration, reservation, display and availability"><rect width="1200" height="310" rx="16" fill="#12263b"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="38" fill="#f4f9fc" font-size="24" font-weight="700" text-anchor="start">Application workflow</text><rect x="448" y="57" width="304" height="60" rx="9" fill="#1d4a58" stroke="#73dfca"/><text x="600" y="82" fill="#f4f9fc" font-size="20" font-weight="700" text-anchor="middle">Main menu</text><text x="600" y="102" fill="#bdd3df" font-size="13" font-weight="400" text-anchor="middle">Choose an operation</text><g stroke="#73dfca" fill="none" stroke-width="2"><path d="M600 117V146H164V176M600 146H455V176M600 146H745V176M600 146H1036V176"/></g><rect x="36" y="176" width="256" height="97" rx="9" fill="#203f53" stroke="#45677a"/><text x="52" y="199" fill="#73dfca" font-size="13" font-weight="700" text-anchor="start">01 / ADD BUS</text><text x="52" y="228" fill="#f4f9fc" font-size="19" font-weight="700" text-anchor="start">Registration</text><text x="52" y="251" fill="#bdd3df" font-size="13" font-weight="400" text-anchor="start">Number, driver, route</text><rect x="327" y="176" width="256" height="97" rx="9" fill="#203f53" stroke="#45677a"/><text x="343" y="199" fill="#73dfca" font-size="13" font-weight="700" text-anchor="start">02 / RESERVE</text><text x="343" y="228" fill="#f4f9fc" font-size="19" font-weight="700" text-anchor="start">Seat booking</text><text x="343" y="251" fill="#bdd3df" font-size="13" font-weight="400" text-anchor="start">Bus, seat, passenger</text><rect x="617" y="176" width="256" height="97" rx="9" fill="#203f53" stroke="#45677a"/><text x="633" y="199" fill="#73dfca" font-size="13" font-weight="700" text-anchor="start">03 / DISPLAY</text><text x="633" y="228" fill="#f4f9fc" font-size="19" font-weight="700" text-anchor="start">Show reservation</text><text x="633" y="251" fill="#bdd3df" font-size="13" font-weight="400" text-anchor="start">Seat map and details</text><rect x="908" y="176" width="256" height="97" rx="9" fill="#203f53" stroke="#45677a"/><text x="924" y="199" fill="#73dfca" font-size="13" font-weight="700" text-anchor="start">04 / AVAILABLE</text><text x="924" y="228" fill="#f4f9fc" font-size="19" font-weight="700" text-anchor="start">Fleet list</text><text x="924" y="251" fill="#bdd3df" font-size="13" font-weight="400" text-anchor="start">Registered bus details</text><text x="36" y="294" fill="#9eb8c9" font-size="13" font-weight="400" text-anchor="start">Option 5 exits the program; the other options return to the menu.</text></g></svg>